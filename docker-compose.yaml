
services:
  postgres:
    image: postgres:17
    container_name: interview-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "4000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d interview_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
